# ONLYOFFICE Docs (Community, gratis) + Caddy con HTTPS automático.
# Se despliega en un servidor aparte (p. ej. Oracle Cloud Free). Ver README.md.
#
#   cp .env.example .env   # y rellenar DOMINIO y JWT_SECRET
#   docker compose up -d

services:
  onlyoffice:
    image: onlyoffice/documentserver:8.2
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_HEADER: Authorization
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_cache:/var/lib/onlyoffice
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - onlyoffice
    restart: unless-stopped

volumes:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_cache:
  caddy_data:
  caddy_config:
